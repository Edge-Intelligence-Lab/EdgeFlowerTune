[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lshaped"
version = "0.1.0"
description = "L-shaped online training research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flwr==1.27.0",
  "numpy>=1.26",
  "psutil>=7.0",
  "pynvml>=13.0.1",
  "pyyaml>=6.0",
  "safetensors>=0.4.5",
  "torch>=2.4.1",
  "transformers>=4.56.2",
  "datasets>=4.1.1",
  "accelerate>=1.10.1",
  "peft>=0.17.1",
  "paramiko>=3.5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
