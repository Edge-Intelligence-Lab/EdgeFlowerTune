runtime:
  run_name: classic_fl_qwen05b_flexlora_lora_two_phone_jad_mate20_socialqa_seq64_b8_r1_l3
  output_dir: outputs/classic_fl_qwen05b_flexlora_lora_two_phone_jad_mate20_socialqa_seq64_b8_r1_l3
  seed: 7
flower:
  server_address: 0.0.0.0:20353
  grpc_max_message_length: 536870912
  num_rounds: 1
  min_available_clients: 2
  min_fit_clients: 2
  sample_clients: 2
  round_timeout: 10800
  eval_every_rounds: 0
  client_wait_timeout: 7200
federated:
  algorithm: flexlora
  aggregate_by_num_examples: true
  local_steps: 3
  local_epochs: 0
  grad_accum_steps: 8
  jetson_grad_accum_steps: 8
  prox_mu: 0.0
  client_lora_ranks:
    jad_24: 8
    mate20_144: 4
dataset:
  source: mmlu_csv
  source_path: data/socialqa_qwen/socialqa_train_mmlu.csv
  eval_source_path: data/socialqa_qwen/socialqa_validation_mmlu.csv
  final_test_source_path: data/socialqa_qwen/socialqa_test_mmlu.csv
  split: train
  eval_split: validation
  num_clients: 2
  client_ids:
  - jad_24
  - mate20_144
  batch_size: 8
  jetson_batch_size: 1
  max_seq_len: 64
  partition_mode: round_robin
  dirichlet_alpha: 0.8
  smoke_test_examples: 0
