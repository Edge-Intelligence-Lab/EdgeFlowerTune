runtime:
  run_name: run_gemma_real_full_five_client_cpu_smoke
  output_dir: outputs/run_gemma_real_full_five_client_cpu_smoke
  seed: 7

flower:
  server_address: 0.0.0.0:19080
  grpc_max_message_length: 536870912
  num_rounds: 1
  min_available_clients: 5
  min_fit_clients: 5
  sample_clients: 5
  round_timeout: 1800
  eval_every_rounds: 0
  client_wait_timeout: 1200

dataset:
  source: synthetic
  source_path: ""
  split: train
  eval_split: test
  num_clients: 5
  client_ids:
    - nano_64
    - nano_88
    - nova_19
    - nova_72
    - nova_49
  batch_size: 1
  max_seq_len: 128
  partition_mode: round_robin
  dirichlet_alpha: 0.8
  smoke_test_examples: 5

model:
  model_name_or_path: /datapool/BESTTOOLBOX/google/gemma-3-270m-it
  device: cpu
  dtype: float32
  target_embedding_mode: scaled_input_embedding
  freeze_input_embeddings: true
  grad_clip_norm: 1.0
  learning_rate: 1.0e-5
  weight_decay: 0.01
  training_mode: full

loss:
  temperature: 1.0
  queue_size: 16
  use_in_batch_negatives: true

client:
  backend: mobilefinetuner_cpp
  split_layer: 0
  upload_dtype: float32
  pad_to_max_seq_len: false

logging:
  save_every_rounds: 1
  log_every_rounds: 1
  save_optimizer: false
