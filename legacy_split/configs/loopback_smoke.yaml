runtime:
  run_name: loopback_smoke
  output_dir: outputs/loopback_smoke
  seed: 7

flower:
  server_address: 0.0.0.0:19080
  grpc_max_message_length: 536870912
  num_rounds: 12
  min_available_clients: 1
  min_fit_clients: 1
  sample_clients: 1
  round_timeout: 600
  eval_every_rounds: 4

dataset:
  source: synthetic
  source_path: ""
  split: train
  eval_split: test
  num_clients: 5
  client_ids:
    - nano_64
    - nano_88
    - nova_19
    - nova_72
    - nova_49
  batch_size: 2
  max_seq_len: 128
  partition_mode: round_robin
  dirichlet_alpha: 0.8
  smoke_test_examples: 20

model:
  model_name_or_path: __random_gemma__
  device: cuda:0
  dtype: float32
  target_embedding_mode: scaled_input_embedding
  freeze_input_embeddings: true
  grad_clip_norm: 1.0
  learning_rate: 1.0e-3
  weight_decay: 0.01

loss:
  temperature: 1.0
  queue_size: 64
  use_in_batch_negatives: true

client:
  backend: hf_embedding
  split_layer: 0
  upload_dtype: float32
  pad_to_max_seq_len: false

logging:
  save_every_rounds: 4
  log_every_rounds: 1
  save_optimizer: true
